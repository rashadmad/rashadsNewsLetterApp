services:
  db:
    image: postgres:16-alpine
    container_name: listmonk_db
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:?set LISTMONK_DB_PASSWORD in .env}
    volumes:
      - listmonk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5

  listmonk:
    image: listmonk/listmonk:v4.1.0
    container_name: listmonk
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./config.toml:/listmonk/config.toml:ro
    environment:
      LISTMONK_DB_PASSWORD: ${LISTMONK_DB_PASSWORD:?set LISTMONK_DB_PASSWORD in .env}
    command:
      - sh
      - -c
      - |
        DB_PASS_ESCAPED=$(printf '%s' "$LISTMONK_DB_PASSWORD" | sed 's/[\/&|]/\\&/g')
        cp /listmonk/config.toml /tmp/config.toml
        sed -i "s|password = \"\"|password = \"$${DB_PASS_ESCAPED}\"|" /tmp/config.toml
        ./listmonk --config /tmp/config.toml

volumes:
  listmonk-db:
